[project]
name = "smartai-rag-tour"
version = "0.1.0"
description = "LangGraph 기반 스마트 여행 비서 (RAG + 날씨/환율 Tool + FastAPI/HTMX 웹)"
requires-python = ">=3.11"
# Vercel 런타임 의존성. 로컬 개발은 requirements.txt (pytest 포함), 로컬 임베딩은 requirements-hf.txt (torch, Vercel 번들 한도 초과).
dependencies = [
    "langgraph>=0.2.60,<2.0",
    "langchain-core>=0.3.30,<2.0",
    "langchain-anthropic>=0.3.0,<2.0",
    "langchain-openai>=0.3.0,<2.0",
    "langchain-community>=0.3.14,<1.0",
    "langchain-text-splitters>=0.3.4,<2.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "faiss-cpu>=1.8.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.7,<3.0",
    "python-dotenv>=1.0.1",
    "fastapi>=0.115,<1.0",
    "jinja2>=3.1,<4.0",
    "python-multipart>=0.0.9",
]

[tool.vercel]
entrypoint = "src.web.app:app"
