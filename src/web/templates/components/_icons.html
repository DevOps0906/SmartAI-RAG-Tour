{#- 내부 아이콘 모음 (24x24 stroke). 사용: {% from "components/_icons.html" import icon %}{{ icon("send", "h-4 w-4") }} -#}
{% macro icon(name, cls="h-4 w-4") -%}
<svg class="{{ cls }} shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{%- if name == "send" %}<path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/>
{%- elif name == "plus" %}<path d="M12 5v14M5 12h14"/>
{%- elif name == "refresh" %}<path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/>
{%- elif name == "check" %}<path d="m5 12 5 5L20 7"/>
{%- elif name == "alert" %}<path d="M12 3 2 20h20L12 3Z"/><path d="M12 10v4M12 17.5v.01"/>
{%- elif name == "info" %}<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.01"/>
{%- elif name == "x" %}<path d="M6 6l12 12M18 6 6 18"/>
{%- elif name == "file" %}<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5Z"/><path d="M14 3v5h5"/>
{%- elif name == "chevron" %}<path d="m9 6 6 6-6 6"/>
{%- elif name == "chevron-left" %}<path d="m15 6-6 6 6 6"/>
{%- elif name == "chevron-down" %}<path d="m6 9 6 6 6-6"/>
{%- elif name == "pause" %}<path d="M8 5v14M16 5v14"/>
{%- elif name == "play" %}<path d="M7 5v14l12-7L7 5Z"/>
{%- elif name == "search" %}<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>
{%- elif name == "menu" %}<path d="M4 6h16M4 12h16M4 18h16"/>
{%- elif name == "sun-moon" %}<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>
{%- elif name == "clock" %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{%- elif name == "arrow-up" %}<path d="M12 19V5M6 11l6-6 6 6"/>
{%- elif name == "arrow-down" %}<path d="M12 5v14M6 13l6 6 6-6"/>
{%- elif name == "sparkle" %}<path d="M12 3l2.2 5.8L20 11l-5.8 2.2L12 19l-2.2-5.8L4 11l5.8-2.2L12 3Z"/>
{%- elif name == "more" %}<circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/>
{%- elif name == "chat" %}<path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l1.1-4.6A8 8 0 1 1 21 12Z"/>
{%- endif -%}
</svg>
{%- endmacro %}
